<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Misión espacial — Quiz</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f5fb;
      --surface: #fff;
      --surface-soft: #f7f7fc;
      --text: #20213a;
      --muted: #777991;
      --line: #e7e8f0;
      --accent: #6558e8;
      --accent-dark: #5145ce;
      --accent-soft: #efedff;
      --green: #14834c;
      --green-bg: #e4f7ec;
      --red: #d64051;
      --red-bg: #fff0f1;
      --shadow: 0 22px 70px rgb(41 43 86 / 10%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #11121c;
        --surface: #1c1d2a;
        --surface-soft: #252638;
        --text: #f1f0ff;
        --muted: #a4a5bd;
        --line: #343548;
        --accent: #a49aff;
        --accent-dark: #b7afff;
        --accent-soft: #302d4b;
        --green: #69d99a;
        --green-bg: #203b30;
        --red: #ff8591;
        --red-bg: #45272f;
        --shadow: 0 22px 70px rgb(0 0 0 / 25%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 36px 18px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 12% 14%, rgb(255 205 52 / 10%), transparent 30%),
        radial-gradient(ellipse at 88% 18%, rgb(45 105 190 / 8%), transparent 28%),
        radial-gradient(ellipse at 82% 88%, rgb(205 55 66 / 7%), transparent 27%),
        radial-gradient(ellipse at 15% 8%, rgb(130 114 255 / 12%), transparent 32%),
        radial-gradient(ellipse at 88% 92%, rgb(72 196 179 / 10%), transparent 28%),
        var(--bg);
      color: var(--text);
      font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .quiz {
      width: min(100%, 490px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .topbar {
      min-height: 61px;
      padding: 0 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: -.02em;
    }

    .brand-mark {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--accent-soft);
      font-size: 16px;
    }

    .top-note {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .content { padding: 27px 25px 25px; }

    .mission-briefing {
      position: relative;
      margin-bottom: 23px;
      padding: 17px 18px 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 15px;
      background: linear-gradient(135deg, var(--accent-soft), var(--surface-soft) 78%);
      box-shadow: inset 0 1px rgb(255 255 255 / 35%);
    }

    .mission-briefing::after {
      position: absolute;
      top: -35px;
      right: -18px;
      width: 112px;
      height: 112px;
      border: 1px solid var(--line);
      border-radius: 50%;
      content: "";
      opacity: .65;
      pointer-events: none;
    }

    .mission-status {
      position: relative;
      z-index: 1;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .mission-status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px var(--green-bg);
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 6vw, 31px);
      line-height: 1.18;
      letter-spacing: -.045em;
    }

    .intro {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .score-pill {
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--text);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .score-pill strong { color: var(--accent); }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--surface-soft);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #7669f1, #b66df0);
      transition: width 420ms cubic-bezier(.2,.8,.2,1);
    }

    .question-block { margin-top: 27px; }

    .question {
      min-height: 57px;
      margin: 0 0 18px;
      font-size: 19px;
      font-weight: 730;
      line-height: 1.4;
      letter-spacing: -.025em;
    }

    .answers { display: grid; gap: 10px; }

    .answer {
      width: 100%;
      min-height: 51px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
      box-shadow: 0 5px 16px rgb(101 88 232 / 10%);
    }

    .answer:focus-visible, .next-button:focus-visible, .restart-button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer-letter {
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .answer.correct {
      border-color: var(--green);
      background: var(--green-bg);
      color: var(--green);
      box-shadow: inset 4px 0 var(--green), 0 5px 18px rgb(20 131 76 / 10%);
      animation: pop 380ms cubic-bezier(.16,1.4,.45,1);
    }

    .answer.correct .answer-letter { background: var(--green); color: #fff; }

    .answer.incorrect {
      border-color: var(--red);
      background: var(--red-bg);
      color: var(--red);
      box-shadow: inset 4px 0 var(--red), 0 5px 18px rgb(214 64 81 / 10%);
      animation: shake 420ms ease-in-out;
    }

    .answer.incorrect .answer-letter { background: var(--red); color: #fff; }

    .answer-status {
      margin-left: auto;
      padding: 4px 7px;
      flex: 0 0 auto;
      border: 1px solid currentColor;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .07em;
      line-height: 1.2;
      opacity: .9;
    }

    .feedback {
      min-height: 30px;
      margin-top: 13px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }

    .next-row {
      min-height: 50px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .next-button, .restart-button {
      min-height: 43px;
      padding: 0 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease;
    }

    .next-button:hover, .restart-button:hover {
      transform: translateY(-1px);
      background: var(--accent-dark);
    }

    [hidden] { display: none !important; }

    .results { padding: 43px 27px 33px; text-align: center; }

    .result-emoji {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--surface-soft);
      font-size: 48px;
      animation: pop 550ms cubic-bezier(.16,1.4,.45,1);
    }

    .results .eyebrow { margin-bottom: 7px; }
    .results h1 { font-size: 29px; }

    .result-score {
      margin: 12px 0 3px;
      color: var(--accent);
      font-size: 42px;
      font-weight: 850;
      letter-spacing: -.06em;
      line-height: 1.1;
    }

    .result-copy {
      max-width: 335px;
      margin: 11px auto 23px;
      color: var(--muted);
      font-size: 14px;
    }

    .result-detail {
      margin-bottom: 22px;
      padding: 13px;
      border-radius: 14px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 13px;
    }

    .result-detail strong { color: var(--text); }

    .footer-note {
      padding: 0 25px 20px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .footer-note span { color: var(--accent); }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @keyframes pop {
      0% { transform: scale(.94); }
      60% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @media (max-width: 420px) {
      body { padding: 18px 12px; }
      .topbar { padding: 0 19px; }
      .content { padding: 23px 19px 20px; }
      .question { font-size: 18px; }
    }
  </style>
</head>
<body>
  <main class="quiz" aria-label="Cuestionario de exploración espacial">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">🚀</span> Misión espacial</div>
      <div class="top-note">QUIZ · 2 MIN</div>
    </header>

    <section class="content" id="quiz-screen">
      <section class="mission-briefing" aria-labelledby="mission-title">
        <div class="mission-status"><span class="mission-status-dot" aria-hidden="true"></span> Centro de control · En línea</div>
        <p class="eyebrow">Tu misión empieza aquí</p>
        <h1 id="mission-title">¿Cuánto sabes del espacio?</h1>
        <p class="intro">10 preguntas. Un pequeño paso para ti, un gran salto para tu curiosidad.</p>
      </section>

      <div class="stats">
        <span id="question-count">Pregunta 1 de 10</span>
        <span class="score-pill">⭐ Puntos: <strong id="score">0</strong></span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Progreso del cuestionario" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="question-block">
        <h2 class="question" id="question" aria-live="polite"></h2>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
        <div class="next-row">
          <button class="next-button" id="next-button" type="button" hidden>Siguiente <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>

    <section class="results" id="results-screen" aria-live="polite" hidden>
      <div class="result-emoji" id="result-emoji" aria-hidden="true"></div>
      <p class="eyebrow">Misión completada</p>
      <h1 id="result-title">¡Buen viaje!</h1>
      <div class="result-score" id="result-score"></div>
      <p class="result-copy" id="result-copy"></p>
      <div class="result-detail" id="result-detail"></div>
      <button class="restart-button" id="restart-button" type="button">↻ &nbsp; Volver a jugar</button>
    </section>

    <footer class="footer-note" id="footer-note">Hecho para mentes <span>curiosas</span> ✦</footer>
  </main>

  <script>
    const questions = [
      {
        question: "¿Qué planeta es conocido como el planeta rojo?",
        answers: ["Venus", "Marte", "Júpiter", "Mercurio"],
        correct: 1,
        fact: "El óxido de hierro de su superficie le da a Marte ese característico tono rojizo."
      },
      {
        question: "¿Cuál fue el primer ser humano en pisar la Luna?",
        answers: ["Yuri Gagarin", "Buzz Aldrin", "Neil Armstrong", "John Glenn"],
        correct: 2,
        fact: "Neil Armstrong dio aquel pequeño paso el 20 de julio de 1969, durante la misión Apollo 11."
      },
      {
        question: "¿Qué planeta tiene los anillos más visibles y famosos?",
        answers: ["Saturno", "Neptuno", "Urano", "Júpiter"],
        correct: 0,
        fact: "Los anillos de Saturno están formados principalmente por partículas de hielo y roca."
      },
      {
        question: "¿Cómo se llama la galaxia donde está nuestro sistema solar?",
        answers: ["Andrómeda", "Galaxia del Sombrero", "Vía Láctea", "Triángulo"],
        correct: 2,
        fact: "Nuestro sistema solar vive en uno de los brazos espirales de la Vía Láctea."
      },
      {
        question: "¿Cuál es la estrella más cercana a la Tierra?",
        answers: ["Sirio", "El Sol", "Próxima Centauri", "Vega"],
        correct: 1,
        fact: "El Sol está a unos 150 millones de kilómetros. La siguiente estrella más cercana es Próxima Centauri."
      },
      {
        question: "¿Qué fuerza mantiene a los planetas en órbita alrededor del Sol?",
        answers: ["El magnetismo", "La fricción", "La gravedad", "La presión solar"],
        correct: 2,
        fact: "La gravedad del Sol curva el movimiento de los planetas y los mantiene en sus órbitas."
      },
      {
        question: "¿En qué planeta se encuentra Olympus Mons, el volcán más grande conocido?",
        answers: ["La Tierra", "Venus", "Marte", "Mercurio"],
        correct: 2,
        fact: "Olympus Mons está en Marte: mide unos 22 km de altura, casi tres veces el Everest."
      },
      {
        question: "¿Qué objeto celeste orbita la Tierra y refleja la luz del Sol?",
        answers: ["La Luna", "Una estrella", "Un cometa", "Una nebulosa"],
        correct: 0,
        fact: "La Luna no produce luz propia: vemos la luz solar reflejada en su superficie."
      },
      {
        question: "¿Cuál es el planeta más grande del sistema solar?",
        answers: ["Saturno", "Júpiter", "Neptuno", "Tierra"],
        correct: 1,
        fact: "Júpiter es tan grande que todos los demás planetas podrían caber dentro de él."
      },
      {
        question: "¿Cómo se llama el telescopio espacial lanzado en 2021 para observar el universo infrarrojo?",
        answers: ["Hubble", "Kepler", "James Webb", "Chandra"],
        correct: 2,
        fact: "El telescopio James Webb observa el universo en luz infrarroja y estudia galaxias muy lejanas."
      }
    ];

    const questionCount = document.getElementById("question-count");
    const scoreDisplay = document.getElementById("score");
    const progress = document.querySelector('[role="progressbar"]');
    const progressFill = document.getElementById("progress-fill");
    const questionTitle = document.getElementById("question");
    const answersContainer = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("next-button");
    const quizScreen = document.getElementById("quiz-screen");
    const resultsScreen = document.getElementById("results-screen");
    const footerNote = document.getElementById("footer-note");

    let current = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      answered = false;
      const item = questions[current];
      questionCount.textContent = `Pregunta ${current + 1} de ${questions.length}`;
      questionTitle.textContent = item.question;
      answersContainer.replaceChildren();
      feedback.textContent = "";
      feedback.className = "feedback";
      nextButton.hidden = true;

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.setAttribute("aria-pressed", "false");
        button.innerHTML = `<span class="answer-letter">${String.fromCharCode(65 + index)}</span><span>${answer}</span>`;
        button.addEventListener("click", () => chooseAnswer(index));
        answersContainer.append(button);
      });

      const progressValue = Math.round((current / questions.length) * 100);
      progressFill.style.width = `${progressValue}%`;
      progress.setAttribute("aria-valuenow", String(current));
    }

    function chooseAnswer(selected) {
      if (answered) return;
      answered = true;
      const item = questions[current];
      const buttons = [...answersContainer.querySelectorAll(".answer")];
      buttons.forEach((button, index) => {
        button.disabled = true;
        button.setAttribute("aria-pressed", String(index === selected));
      });

      function setStatus(index, label) {
        const status = document.createElement("span");
        status.className = "answer-status";
        status.setAttribute("aria-hidden", "true");
        status.textContent = label;
        buttons[index].append(status);
      }

      if (selected === item.correct) {
        score += 1;
        scoreDisplay.textContent = String(score);
        buttons[selected].classList.add("correct");
        setStatus(selected, "CONFIRMADO");
        feedback.className = "feedback good";
        feedback.innerHTML = `<span aria-hidden="true">✦</span> ¡Correcto! ${item.fact}`;
      } else {
        buttons[selected].classList.add("incorrect");
        buttons[item.correct].classList.add("correct");
        setStatus(selected, "NO AUTORIZADO");
        setStatus(item.correct, "OBJETIVO");
        feedback.className = "feedback bad";
        feedback.innerHTML = `<span aria-hidden="true">↗</span> ¡Casi! ${item.fact}`;
      }

      nextButton.textContent = current === questions.length - 1 ? "Ver resultados" : "Siguiente";
      nextButton.insertAdjacentHTML("beforeend", ' <span aria-hidden="true">→</span>');
      nextButton.hidden = false;
    }

    function showResults() {
      quizScreen.hidden = true;
      footerNote.hidden = true;
      resultsScreen.hidden = false;
      progressFill.style.width = "100%";
      progress.setAttribute("aria-valuenow", String(questions.length));

      const percentage = score / questions.length;
      let emoji, title, copy;
      if (percentage === 1) {
        emoji = "🏆"; title = "¡Eres de otra galaxia!";
        copy = "¡Pleno cósmico! Tienes el universo en la punta de los dedos.";
      } else if (percentage >= 0.7) {
        emoji = "🚀"; title = "¡Gran explorador!";
        copy = "Tu curiosidad va a velocidad de escape. ¡Sigue mirando hacia arriba!";
      } else if (percentage >= 0.4) {
        emoji = "🌙"; title = "¡Vas por buen camino!";
        copy = "Cada respuesta es un paso más en tu viaje por el cosmos.";
      } else {
        emoji = "🪐"; title = "¡Despegue de aprendizaje!";
        copy = "El universo es enorme y ya empezaste a explorarlo. ¡Inténtalo otra vez!";
      }

      document.getElementById("result-emoji").textContent = emoji;
      document.getElementById("result-title").textContent = title;
      document.getElementById("result-score").textContent = `${score} / ${questions.length}`;
      document.getElementById("result-copy").textContent = copy;
      document.getElementById("result-detail").innerHTML =
        `<strong>${score === questions.length ? "¡Todas correctas!" : `${questions.length - score} para seguir descubriendo`}</strong><br>Has completado tu misión espacial.`;
    }

    nextButton.addEventListener("click", () => {
      if (current < questions.length - 1) {
        current += 1;
        renderQuestion();
      } else {
        showResults();
      }
    });

    document.getElementById("restart-button").addEventListener("click", () => {
      current = 0;
      score = 0;
      scoreDisplay.textContent = "0";
      resultsScreen.hidden = true;
      quizScreen.hidden = false;
      footerNote.hidden = false;
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
